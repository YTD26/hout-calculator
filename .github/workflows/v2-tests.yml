name: v2 tests

on:
  push:
    paths: ["v2/**", ".github/workflows/v2-tests.yml"]
  pull_request:
    paths: ["v2/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
